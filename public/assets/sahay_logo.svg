<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" fill="none">
  <!-- White Background -->
  <rect width="600" height="420" fill="#FFFFFF"/>

  <!-- EMBLEM GROUP (Centered at X: 300, Y: 120) -->
  <g id="logo-emblem" transform="translate(200, 10)">
    <!-- Left Orange Orbit Arc -->
    <path d="M 28 85 C 10 105, 30 135, 75 140 C 95 142, 105 138, 115 132" stroke="#F5821F" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <circle cx="28" cy="85" r="5" fill="#F5821F" />

    <!-- Right Green Orbit Arc -->
    <path d="M 85 68 C 120 62, 185 70, 172 108 C 165 125, 140 138, 115 132" stroke="#2E9E4F" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <circle cx="170" cy="90" r="5" fill="#2E9E4F" />

    <!-- Top Gear / Cogwheel in Navy #0B2A5C -->
    <g id="gear-teeth">
      <path d="M 72 42 L 76 28 L 86 28 L 89 40 
               M 93 39 L 98 25 L 108 25 L 112 39 
               M 117 41 L 126 28 L 136 30 L 137 45 
               M 65 47 L 55 35 L 63 29 L 75 42
               M 60 55 L 48 48 L 54 40 L 67 48"
            stroke="#0B2A5C" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M 52 75 C 50 45, 70 34, 103 34 C 136 34, 154 48, 153 75"
            stroke="#0B2A5C" stroke-width="7" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Tricolor Saffron/Orange and Green Arcs -->
    <path d="M 74 96 C 68 76, 78 52, 103 48" stroke="#F5821F" stroke-width="9" stroke-linecap="round" fill="none" />
    <path d="M 103 48 C 128 52, 138 76, 132 96" stroke="#2E9E4F" stroke-width="9" stroke-linecap="round" fill="none" />

    <!-- Central Ashoka Chakra -->
    <circle cx="103" cy="76" r="21" fill="#FFFFFF" stroke="#0B2A5C" stroke-width="2.5" />
    <circle cx="103" cy="76" r="4.5" fill="#0B2A5C" />
    <circle cx="103" cy="76" r="18.5" fill="none" stroke="#0B2A5C" stroke-width="1" />
    <!-- 24 Spokes -->
    <g stroke="#0B2A5C" stroke-width="1.2">
      <line x1="103" y1="76" x2="103" y2="58" />
      <line x1="103" y1="76" x2="103" y2="94" />
      <line x1="103" y1="76" x2="85" y2="76" />
      <line x1="103" y1="76" x2="121" y2="76" />
      <line x1="103" y1="76" x2="115.7" y2="63.3" />
      <line x1="103" y1="76" x2="90.3" y2="88.7" />
      <line x1="103" y1="76" x2="90.3" y2="63.3" />
      <line x1="103" y1="76" x2="115.7" y2="88.7" />
      <line x1="103" y1="76" x2="107.7" y2="58.6" />
      <line x1="103" y1="76" x2="98.3" y2="93.4" />
      <line x1="103" y1="76" x2="112" y2="60.5" />
      <line x1="103" y1="76" x2="94" y2="91.5" />
      <line x1="103" y1="76" x2="118.6" y2="67.3" />
      <line x1="103" y1="76" x2="87.4" y2="84.7" />
      <line x1="103" y1="76" x2="120.5" y2="71.3" />
      <line x1="103" y1="76" x2="85.5" y2="80.7" />
      <line x1="103" y1="76" x2="120.5" y2="80.7" />
      <line x1="103" y1="76" x2="85.5" y2="71.3" />
      <line x1="103" y1="76" x2="118.6" y2="84.7" />
      <line x1="103" y1="76" x2="87.4" y2="67.3" />
      <line x1="103" y1="76" x2="112" y2="91.5" />
      <line x1="103" y1="76" x2="94" y2="60.5" />
      <line x1="103" y1="76" x2="107.7" y2="93.4" />
      <line x1="103" y1="76" x2="98.3" y2="58.6" />
    </g>

    <!-- Handshake Lightbulb Base -->
    <path d="M 76 100 C 76 112, 85 125, 96 128 C 99 129, 102 129, 104 126 L 98 120 L 92 122 L 96 114 L 88 114 L 92 106 L 85 106 Z" fill="#F5821F" />
    <path d="M 73 98 C 76 114, 88 128, 102 134" stroke="#0B2A5C" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M 130 98 C 127 114, 116 128, 102 134" stroke="#0B2A5C" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M 130 98 C 130 110, 120 125, 106 130 L 102 126 C 108 122, 115 116, 116 108 L 108 108 C 114 102, 118 98, 122 98 Z" fill="#0B2A5C" />

    <!-- Clasped fingers interlocking detail -->
    <rect x="94" y="118" width="16" height="4" rx="2" fill="#F5821F" transform="rotate(25 94 118)" />
    <rect x="98" y="123" width="14" height="3.5" rx="1.7" fill="#F5821F" transform="rotate(25 98 123)" />
    <rect x="100" y="112" width="16" height="4" rx="2" fill="#0B2A5C" transform="rotate(-25 100 112)" />
    <rect x="96" y="117" width="14" height="3.5" rx="1.7" fill="#0B2A5C" transform="rotate(-25 96 117)" />

    <!-- Bulb Threaded Screw Base -->
    <rect x="92" y="138" width="22" height="4.5" rx="2.2" fill="#0B2A5C" />
    <rect x="94" y="145" width="18" height="4" rx="2" fill="#0B2A5C" />
    <rect x="97" y="151" width="12" height="3.5" rx="1.7" fill="#0B2A5C" />
    <path d="M 100 156 Q 103 160 106 156 Z" fill="#0B2A5C" />
  </g>

  <!-- WORDMARK: SAHAY -->
  <g id="wordmark-sahay" transform="translate(300, 275)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="78" fill="#0B2A5C" letter-spacing="-2">
      S<tspan dx="4">A</tspan><tspan dx="4">H</tspan><tspan dx="4">A</tspan><tspan dx="4">Y</tspan>
    </text>

    <!-- First A Orange Triangle -->
    <polygon points="-79, -32 -62, -2 -96, -2" fill="#F5821F" />

    <!-- Second A Green Triangle -->
    <polygon points="78, -32 95, -2 61, -2" fill="#2E9E4F" />
  </g>

  <!-- SUBTITLE BAR -->
  <g id="subtitle-bar" transform="translate(0, 318)">
    <line x1="80" y1="0" x2="140" y2="0" stroke="#F5821F" stroke-width="3" stroke-linecap="round" />
    <text x="300" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" fill="#0B2A5C" letter-spacing="0.5">
      Startup Assistance &amp; Government Innovation Hub
    </text>
    <line x1="460" y1="0" x2="520" y2="0" stroke="#2E9E4F" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- TAGLINE -->
  <text x="300" y="360" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#0B2A5C" letter-spacing="7">
    DISCOVER. PILOT. VALIDATE. SCALE.
  </text>
</svg>
